<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- Decorative tile: stylized Adinkra symbols (Gye Nyame-inspired spiral, Sankofa bird,
       Dwennimmen ram's horns) plus simple silhouettes referencing Ghana's coastal forts
       (e.g. Cape Coast / Elmina Castle) and museum architecture. Single low-opacity tone
       so it reads as a subtle texture, not competing with the interface. -->
  <g opacity="0.16">

    <!-- Gye Nyame-inspired spiral motif (supremacy / omnipotence) -->
    <g transform="translate(72,74)">
      <path d="M0,-34 A34,34 0 1 1 -23,23 A18,18 0 1 0 -5,9 A5,5 0 1 1 2,1"
            fill="none" stroke="#D9A404" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Sankofa bird (learn from the past) -->
    <g transform="translate(356,92)">
      <path d="M0,28 C-20,28 -31,9 -27,-7 C-24,-20 -11,-27 2,-24
               C13,-20 16,-9 11,-2 C7,3 0,2 -2,-4 C-4,-8 0,-12 4,-10
               M4,-10 L17,-22"
            fill="none" stroke="#D9A404" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="15" cy="-21" r="2.2" fill="#D9A404"/>
    </g>

    <!-- Dwennimmen — ram's horns (humility with strength) -->
    <g transform="translate(96,326)">
      <path d="M-24,0 C-24,-14 -11,-14 -7,-4 C-5,2 -9,5 -13,2
               M24,0 C24,-14 11,-14 7,-4 C5,2 9,5 13,2
               M-7,-4 L7,-4"
            fill="none" stroke="#D9A404" stroke-width="5.5" stroke-linecap="round"/>
    </g>

    <!-- Coastal fort silhouette (references Cape Coast / Elmina Castle ramparts) -->
    <g transform="translate(300,346)" fill="#D9A404">
      <path d="M-48,38 L-48,12 L-40,12 L-40,2 L-32,2 L-32,12 L-24,12 L-24,-2 L-16,-2 L-16,12
               L-4,12 L-4,-4 L4,-4 L4,12 L16,12 L16,2 L24,2 L24,12 L32,12 L32,38 Z"/>
      <rect x="-48" y="38" width="80" height="6"/>
    </g>

    <!-- Museum / civic building silhouette (triangular pediment + columns) -->
    <g transform="translate(122,184)" fill="#D9A404">
      <path d="M-28,24 L0,3 L28,24 Z"/>
      <rect x="-24" y="24" width="6" height="19"/>
      <rect x="-13" y="24" width="6" height="19"/>
      <rect x="-3" y="24" width="6" height="19"/>
      <rect x="8" y="24" width="6" height="19"/>
      <rect x="19" y="24" width="6" height="19"/>
      <rect x="-30" y="43" width="62" height="5"/>
    </g>

  </g>
</svg>
